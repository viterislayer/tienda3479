<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda 3479</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Tienda 3479</h1>
    <span id="estado" class="estado">Conectando...</span>
  </header>

  <nav id="pestanas">
    <button data-vista="ventas" class="activa">Ventas</button>
    <button data-vista="productos">Productos</button>
    <button data-vista="categorias">Categorías</button>
    <button data-vista="clientes">Clientes</button>
  </nav>

  <main>
    <!-- Ventas -->
    <section id="vista-ventas">
      <div class="tarjeta">
        <h2>Nueva venta</h2>
        <form id="form-venta">
          <div class="fila">
            <label>Cliente
              <select id="venta-cliente" required></select>
            </label>
          </div>
          <div class="fila">
            <label>Producto
              <select id="venta-producto"></select>
            </label>
            <label>Cantidad
              <input id="venta-cantidad" type="number" min="1" step="1" value="1">
            </label>
            <button type="button" id="btn-agregar" class="secundario">Agregar</button>
          </div>
          <table>
            <thead>
              <tr><th>Producto</th><th>Precio</th><th>Cantidad</th><th>Subtotal</th><th></th></tr>
            </thead>
            <tbody id="venta-lineas"></tbody>
            <tfoot>
              <tr><th colspan="3">Total</th><th id="venta-total">Q 0.00</th><th></th></tr>
            </tfoot>
          </table>
          <div class="acciones">
            <button type="submit">Registrar venta</button>
          </div>
        </form>
      </div>

      <div class="tarjeta">
        <h2>Historial de ventas</h2>
        <table>
          <thead>
            <tr><th>#</th><th>Fecha</th><th>Cliente</th><th>Productos</th><th>Total</th><th>Acciones</th></tr>
          </thead>
          <tbody id="ventas-lista"></tbody>
        </table>
        <div id="venta-detalle" class="detalle" hidden></div>
      </div>
    </section>

    <!-- Productos, categorías y clientes (vista genérica) -->
    <section id="vista-crud" hidden>
      <div class="tarjeta">
        <form id="form-crud">
          <h2 id="crud-titulo"></h2>
          <div id="crud-campos" class="fila"></div>
          <div class="acciones">
            <button type="submit">Guardar</button>
            <button type="button" id="crud-cancelar" class="secundario" hidden>Cancelar</button>
          </div>
        </form>
      </div>
      <div class="tarjeta">
        <table>
          <thead id="crud-cabecera"></thead>
          <tbody id="crud-filas"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="aviso" class="aviso" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
