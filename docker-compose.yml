services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_CONNECT_STRING: oracle:1521/FREEPDB1
      PORT: 3000
      TZ: America/Guatemala
    networks:
      web:
        aliases:
          - tienda3479

networks:
  web:
    external: true
