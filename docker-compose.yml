services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: oracle
      DB_PORT: 1521
      DB_SERVICE: FREEPDB1
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PORT: 3000
      TZ: America/Guatemala
    networks:
      web:
        aliases:
          - tienda3479

networks:
  web:
    external: true
