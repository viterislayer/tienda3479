services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PORT: 3000
      TZ: America/Guatemala
    networks:
      web:
        aliases:
          - tienda3479

networks:
  web:
    external: true
